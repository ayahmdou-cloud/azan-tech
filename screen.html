<body>

<button class="unlock" id="unlock" type="button"><b>🔊 اكبس هون لتفعيل الأذان على هالجهاز</b><span>المتصفح ما بيسمح بالصوت قبل أول كبسة. خلّي هالشاشة مفتوحة.</span></button>
<style>
  .qiblabtn { left: 64px; }
  .unlock { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 2px; text-align: center;
    background: #d8b46a; color: #1a1408; border: 0; border-radius: 16px; padding: 12px 18px; font: inherit; font-size: 13px; box-shadow: 0 8px 30px rgba(0,0,0,.4); cursor: pointer; max-width: calc(100% - 32px); }
  .unlock b { font-size: 15px; }
  .unlock[hidden] { display: none; }
</style>
<main class="scr night" id="scr">
  <svg class="stars" width="100%" height="100%" id="stars"></svg>
  <div class="s-top">
    <div class="s-dates"><b id="greg"></b><span id="hijri"></span><br><span id="mosqueName"></span></div>
    <div class="s-sky"><div class="moonbox" id="moon" hidden></div><div class="wxbox" id="wxbox" hidden></div></div>
  </div>
  <div id="bar"></div>
  <div id="memo"></div>
  <div id="center"></div>
  <div class="ccard" id="ccard" hidden></div>
  <div id="fast"></div>
  <div id="arc"></div>
  <div class="s-cards" id="cards"></div>
</main>

<script src="praytimes.js?v=__V__"></script>
<script src="core.js?v=__V__"></script>
<script>if (!AzanTech.S.setupDone) location.replace('setup.html');
  document.getElementById('unlock').onclick = () => { AzanTech.unlock(); document.getElementById('unlock').hidden = true; try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {} };</script>
<script src="weather.js?v=__V__"></script>
<script src="content.js?v=__V__"></script>
<script src="player.js?v=__V__"></script>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const fmt = (d) => new Date(d).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  const KEYS = ['fajr', 'dhuhr', 'asr', 'maghrib', 'isha'];
  const NAMES = { fajr: 'الفجر', sunrise: 'الشروق', dhuhr: 'الظهر', jumua: 'الجمعة', asr: 'العصر', maghrib: 'المغرب', isha: 'العشاء' };
  const WDN = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  const HM = ['محرّم', 'صفر', 'ربيع الأول', 'ربيع الآخر', 'جمادى الأولى', 'جمادى الآخرة', 'رجب', 'شعبان', 'رمضان', 'شوّال', 'ذو القعدة', 'ذو الحجة'];
  let st = null, W = null, wakeLock = null, cIdx = 0, lastRot = Date.now(), lastKey = '';

  // ---------- مساعدات ----------
  const D = () => (st && st.settings.display) || {};
  function hij(date) {
    try {
      const d = new Date(+date + (st && typeof st.hijriAdjTotal === 'number' ? st.hijriAdjTotal : (+D().hijriAdj || 0)) * 864e5);
      const p = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn', { day: 'numeric', month: 'numeric', year: 'numeric' }).formatToParts(d);
      const g = (t) => parseInt(p.find((x) => x.type === t).value, 10);
      return { d: g('day'), m: g('month'), y: g('year') };
    } catch (e) { return null; }
  }
  function fastInfo(date) {
    const h = hij(date), wd = new Date(date).getDay(), L = [];
    if (!h) return { list: L, no: true, wd };
    if ((h.m === 10 && h.d === 1) || (h.m === 12 && h.d === 10) || (h.m === 12 && h.d >= 11 && h.d <= 13)) return { h, wd, list: L, no: true };
    if (h.m === 9) return { h, wd, list: ['رمضان'], no: false };
    if (h.m === 12 && h.d === 9) L.push('يوم عرفة'); else if (h.m === 12 && h.d <= 8) L.push('من عشر ذي الحجة');
    if (h.m === 1 && h.d === 10) L.push('عاشوراء');
    if (h.m === 1 && h.d === 9) L.push('تاسوعاء');
    if (h.m === 10 && h.d >= 2 && h.d <= 7) L.push('من الست من شوّال');
    if (h.d >= 13 && h.d <= 15) L.push('الأيام البيض');
    if (wd === 1 || wd === 4) L.push(WDN[wd]);
    return { h, wd, list: L, no: false };
  }
  function fastCard(f, when, ref) {
    if (!f.list.length || f.no || f.list.includes('رمضان')) return '';
    const labels = f.list.filter((l) => l in FAST_HADITH);
    const main = FAST_HADITH[labels.find((l) => !/الاثنين|الخميس/.test(l)) || labels[0]];
    if (!main) return '';
    const t = when === 'اليوم' ? ['الإفطار', fmt(ref.maghrib)] : ['الإمساك', fmt(+new Date(ref.fajr) - 10 * 6e4)];
    return `<div class="fcard"><div class="fic">${CRESCENT}</div>
      <div><div class="fwhen">${when} ${WDN[f.wd]} · ${f.h.d} ${HM[f.h.m - 1]}</div>
        <div class="ftitle">${labels.map((l) => FAST_HADITH[l][0]).join(' · ')} <span class="ftag">يُسنّ صيامه</span></div>
        <div class="fhad">${main[1]} — ${main[2]}</div></div>
      <div class="ftime"><span>${t[0]}</span><b class="ltr">${t[1]}</b></div></div>`;
  }
  // القمر
  function moonAge(d = new Date()) { const syn = 29.530588853, ref = Date.UTC(2000, 0, 6, 18, 14); return (((d - ref) / 864e5) % syn + syn) % syn / syn; }
  function moonName(f) { return f < .03 || f > .97 ? 'محاق' : f < .22 ? 'هلال' : f < .28 ? 'تربيع أول' : f < .47 ? 'أحدب متزايد' : f < .53 ? 'بدر' : f < .72 ? 'أحدب متناقص' : f < .78 ? 'تربيع أخير' : 'هلال آخر الشهر'; }
  function moonSVG(f, size) {
    const r = 40, k = Math.cos(2 * Math.PI * f), wax = f < .5, rx = Math.abs(k) * r, so = wax ? 1 : 0, si = k < 0 ? (wax ? 1 : 0) : (wax ? 0 : 1);
    return `<svg width="${size}" height="${size}" viewBox="-50 -50 100 100"><defs><radialGradient id="mg"><stop offset="0" stop-color="#fff8e0"/><stop offset="1" stop-color="#e8d8a8"/></radialGradient></defs><circle r="${r}" fill="#2a3236"/><path d="M0 ${-r} A${r} ${r} 0 0 ${so} 0 ${r} A${rx} ${r} 0 0 ${si} 0 ${-r}Z" fill="url(#mg)"/><circle r="${r + 6}" fill="none" stroke="#e8d8a8" stroke-opacity=".12" stroke-width="6"/></svg>`;
  }
  (function stars() { let s = ''; for (let i = 0; i < 70; i++) { const x = (i * 37.7) % 100, y = (i * 53.3) % 100, r = (i % 5 === 0) ? 1.4 : .8; s += `<circle cx="${x}%" cy="${y}%" r="${r}" fill="#fff" opacity="${.3 + (i % 7) / 10}"/>`; } $('stars').innerHTML = s; })();

  // ---------- المحتوى ----------
  const doy = (d) => Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5);
  function contentItem(now, T) {
    const C = D().content || {}, cats = ['adhkar', 'ayah', 'dua', 'hadith', 'names'].filter((c) => C[c] !== false);
    if (!cats.length) return null;
    const cat = cats[cIdx % cats.length], k = Math.floor(cIdx / cats.length), dy = doy(now);
    if (cat === 'adhkar') {
      const [list, label] = now >= T.fajr && now < T.dhuhr ? [AZ.morning, '☀️ أذكار الصباح'] : now >= T.asr && now < T.isha ? [AZ.evening, '🌆 أذكار المساء'] : now >= T.isha || now < T.fajr ? [AZ.sleep, '🌙 أذكار النوم'] : [AZ.general, '📿 ذكر'];
      return { k: label, ...list[k % list.length] };
    }
    if (cat === 'ayah') return { k: '📖 آية اليوم', ...AYAT[dy % AYAT.length] };
    if (cat === 'hadith') return { k: '💬 حديث اليوم', ...HADITH[dy % HADITH.length] };
    if (cat === 'dua') return { k: '🤲 دعاء', ...DUA[k % DUA.length] };
    return { k: '✨ من أسماء الله الحسنى', ...NAMES99[(dy + k) % NAMES99.length], big: true };
  }
  const ccardHTML = (it) => `<div class="k">${it.k}</div><div class="tx ${it.big ? 'name' : ''}">${it.tx}</div>${it.src ? `<div class="src">${it.src}</div>` : ''}`;

  // ---------- قوس الشمس ----------
  function sunArc(T, now) {
    const sr = +T.sunrise, mg = +T.maghrib, t = (now - sr) / (mg - sr), up = t > 0 && t < 1;
    const P = (u) => { const a = (1 - u) ** 2, b = 2 * (1 - u) * u, c = u * u; return [a * 560 + b * 300 + c * 40, a * 75 + b * -55 + c * 75]; };
    const mark = (d, lbl) => { const u = (d - sr) / (mg - sr); if (u <= 0 || u >= 1) return ''; const [x, y] = P(u); return `<circle cx="${x}" cy="${y}" r="3" fill="currentColor" opacity=".5"/><text x="${x}" y="${y - 8}" text-anchor="middle" font-size="17" fill="currentColor" opacity=".75">${lbl}</text>`; };
    const [sx, sy] = P(Math.min(1, Math.max(0, t)));
    return `<div class="s-arc"><svg viewBox="0 -22 600 122" aria-hidden="true">
      <path d="M560 75 Q300 -55 40 75" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="2" ${up ? '' : 'stroke-dasharray="4 6"'}/>
      ${up ? `<polyline fill="none" stroke="var(--s-accent)" stroke-width="3" stroke-linecap="round" points="${Array.from({ length: 41 }, (_, i) => P(t * i / 40).map((v) => v.toFixed(1)).join(',')).join(' ')}"/>` : ''}
      <line x1="20" y1="75" x2="580" y2="75" stroke="currentColor" stroke-opacity=".15"/>
      ${mark(+T.duha, 'الضحى')}${mark(+T.dhuhr, 'الظهر')}${mark(+T.asr, 'العصر')}
      ${up ? `<circle cx="${sx}" cy="${sy}" r="14" fill="#f4c25a" opacity=".25"/><circle cx="${sx}" cy="${sy}" r="8" fill="#f4c25a"/>` : ''}
      <text x="525" y="94" text-anchor="middle" font-size="17" fill="currentColor" opacity=".7">الشروق ${fmt(sr)}</text>
      <text x="75" y="94" text-anchor="middle" font-size="17" fill="currentColor" opacity=".7">المغرب ${fmt(mg)}</text>
      ${up ? '' : `<text x="300" y="40" text-anchor="middle" font-size="17" fill="currentColor" opacity=".7">${now < sr ? 'الشروق بعد ' + Math.round((sr - now) / 6e4) + ' دقيقة' : 'غربت الشمس'}</text>`}
    </svg></div>`;
  }

  // ---------- رمضان ----------
  const hm = (ms) => { const m = Math.max(0, Math.round(ms / 6e4)); return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0'); };
  function ramadanBar(now, T, T2, h) {
    const ra = st.settings.ramadan, im = st.imsakMin || 10;
    const imsakToday = new Date(+T.fajr - im * 6e4), imsakTom = new Date(+T2.fajr - im * 6e4);
    let main;
    if (now < imsakToday) main = `🍽️ الإمساك بعد <b class="ltr">${hm(imsakToday - now)}</b> · <span class="ltr">${fmt(imsakToday)}</span>`;
    else if (now < T.maghrib) main = `🌙 الإفطار بعد <b class="ltr">${hm(T.maghrib - now)}</b> · <span class="ltr">${fmt(T.maghrib)}</span>`;
    else if (now - T.maghrib < 45 * 6e4) main = `🌙 تقبّل الله صيامكم — <b>ذهب الظمأ وابتلّت العروق</b>`;
    else main = `🍽️ الإمساك بعد <b class="ltr">${hm(imsakTom - now)}</b> · <span class="ltr">${fmt(imsakTom)}</span>`;
    let wird = '';
    if (ra.wird && h) { const a = Math.min(30, ((h.d - 1) * ra.juzPerDay) % 30 + 1), b = Math.min(30, a + ra.juzPerDay - 1); wird = ` &nbsp;·&nbsp; 📖 ورد اليوم: ${a === b ? 'الجزء ' + a : 'الأجزاء ' + a + '–' + b}`; }
    const night = h ? h.d + 1 : 0, qadr = ra.qiyam && now > T.maghrib && night >= 21 && night <= 29 && night % 2 ? ` &nbsp;·&nbsp; ✨ ليلة ${night} — من الليالي الوتر` : '';
    return `<div class="alertbar ramadan">${main}${wird}${qadr}</div>`;
  }

  // ---------- الطقس ----------
  function weatherHTML(night) {
    if (!W || W.error) return '';
    const days = D().forecast !== false && W.days ? `<div class="wxdays">${W.days.map((d) => `<div class="wxday"><span>${WDN[new Date(d.date + 'T12:00').getDay()].replace('ال', '')}</span>${WX.icon(d.code, 1)}<b>${Math.round(d.max)}°</b><span>${Math.round(d.min)}°</span></div>`).join('')}</div>` : '';
    return `<div class="wxnow">${WX.icon(W.code, night ? 0 : W.day)}<div><span class="big">${Math.round(W.temp)}°</span><br>${WX.desc(W.code)}</div></div>${days}`;
  }
  async function weather() {
    try { const w = await (await fetch('/api/weather', { cache: 'no-store' })).json(); if (!w.error) { W = w; lastKey = ''; } } catch (e) { /* */ }
  }

  // ---------- البيانات ----------
  async function load() {
    try {
      st = await (await fetch('/api/state', { cache: 'no-store' })).json();
      Player.show(st.nowPlaying, st.activeVolume);
      tick(true);
    } catch (e) { /* السيرفر مش شغّال — منرجع نجرّب */ }
  }
  window.onPlayerStopped = load;

  function times(day) {
    const src = st[day], T = {};
    for (const k of ['fajr', 'sunrise', 'dhuhr', 'asr', 'maghrib', 'isha']) T[k] = new Date(src[k]);
    T.duha = new Date(+T.sunrise + (+D().duhaAfter || 20) * 6e4);
    return T;
  }

  // ---------- الرسم ----------
  function tick(force) {
    const now = new Date();
    const sec = String(now.getSeconds()).padStart(2, '0');
    const clk = $('clk');
    if (clk) clk.innerHTML = fmt(now) + '<small>:' + sec + '</small>';
    const rcd = $('rcd');
    if (rcd && rcd.dataset.t) { let s = Math.max(0, Math.round((+rcd.dataset.t - now) / 1000)); const m = Math.floor(s / 60); s %= 60; rcd.textContent = m + ':' + String(s).padStart(2, '0'); }
    if (!st) return;
    const T = times('today'), T2 = times('tomorrow'), dsp = D();
    const fri = now.getDay() === 5 && st.mosque && st.mosque.jumua;
    // الصلاة القادمة والأخيرة
    const list = [];
    for (const [day, TT] of [['today', T], ['tomorrow', T2]]) KEYS.forEach((k, i) => list.push({ k, i, t: TT[k], day }));
    const next = list.find((p) => p.t > now);
    const last = [...list].reverse().find((p) => p.t <= now);
    const since = last ? (now - last.t) / 6e4 : 999;
    const mins = next ? Math.ceil((next.t - now) / 6e4) : 999;
    const playing = st.nowPlaying && st.nowPlaying.kind;
    let ev = null;
    if (playing === 'azan' || (since < 4 && last && st.settings.prayers[last.i].enabled)) ev = 'adhan';
    else if (playing === 'dua' || (since < 12 && last && st.settings.prayers[last.i].enabled && st.settings.prayers[last.i].dua !== false)) ev = 'after';
    const soon = !ev && dsp.preAlert !== false && mins <= 10;
    const np = next && st.settings.prayers[next.i], rem = np && np.remind ? np.before : 0;
    const duhaNow = dsp.duhaAlert !== false && now >= T.duha && now - T.duha < 15 * 6e4;
    // مرحلة السما
    let phase = 'night';
    if (dsp.sky === false) phase = now >= T.sunrise && now < T.maghrib ? 'day' : 'night';
    else if (now >= T.fajr && now < +T.sunrise + 45 * 6e4) phase = 'dawn';
    else if (now >= +T.maghrib - 40 * 6e4 && now < +T.maghrib + 25 * 6e4) phase = 'sunset';
    else if (now >= T.sunrise && now < T.maghrib) phase = 'day';
    const dim = dsp.nightDim && !ev && !soon && (now >= +T.isha + 3600e3 || now < +T.fajr - 1800e3);
    const scr = $('scr');
    scr.className = 'scr ' + phase + (soon ? ' soon' : '') + (dim ? ' dim' : '');

    // كل دقيقة أو عند تغيّر الحالة منعيد الرسم
    const key = [now.getMinutes(), ev, soon, phase, duhaNow, next && next.k, !!W, cIdx, playing === 'adhkar' && Math.floor(Date.now() / 30000)].join('|');
    if (!force && key === lastKey) return;
    lastKey = key;

    $('greg').textContent = now.toLocaleDateString('ar', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const h = hij(now); $('hijri').textContent = h ? `${h.d} ${HM[h.m - 1]} ${h.y} هـ` : '';
    $('mosqueName').textContent = st.mosque ? '🕌 ' + st.mosque.name : '';
    // القمر والطقس
    const f = moonAge(now);
    $('moon').hidden = !(phase === 'night' && dsp.moon !== false);
    if (!$('moon').hidden) $('moon').innerHTML = moonSVG(f, 56) + '<span>' + moonName(f) + '</span>';
    const wx = weatherHTML(phase === 'night'); $('wxbox').hidden = !wx; if (wx && $('wxbox').dataset.k !== key) { $('wxbox').innerHTML = wx; $('wxbox').dataset.k = key; }
    // الشريط
    let bar = '';
    if (!ev && next && !soon && rem && mins <= rem) bar = `<div class="alertbar">⏰ اقترب وقت صلاة <b>${fri && next.k === 'dhuhr' && next.day === 'today' ? 'الجمعة' : NAMES[next.k]}</b> — بعد ${mins} ${mins <= 10 && mins > 2 ? 'دقائق' : 'دقيقة'}</div>`;
    else if (!ev && duhaNow) bar = `<div class="alertbar duha">🌤️ دخل وقت صلاة <b>الضحى</b> — ويمتدّ إلى قُبيل الظهر</div>`;
    else if (st.ramadan && st.settings.ramadan.auto) bar = ramadanBar(now, T, T2, h);
    $('bar').innerHTML = bar;
    // التذكيرات (المنبّه)
    const ms = (st.memos || []);
    const mk = ms.map((m) => m.key + m.count).join(',');
    if ($('memo').dataset.k !== mk) {
      $('memo').dataset.k = mk;
      $('memo').innerHTML = ms.map((m) => `<div class="memo"><span class="mi">⏰</span><div class="mt"><b>${esc(m.title)}</b><small>${m.count > 1 ? 'تذكير رقم ' + m.count + ' · ' : ''}من الساعة <span class="ltr">${fmt(m.at)}</span></small></div><button class="msnz" data-key="${esc(m.key)}">😴 5 د</button><button class="mdone" data-key="${esc(m.key)}">✅ تمّ</button></div>`).join('');
    }
    // الوسط
    const iq = st.iqamaToday || {};
    if (ev === 'adhan' && last) {
      const iqt = iq[last.k] ? new Date(iq[last.k]) : null, im = iqt ? Math.max(0, Math.round((iqt - now) / 6e4)) : null;
      $('center').innerHTML = `<div class="adhanbox"><div class="ring">🕌</div><div class="s-next">حان الآن وقت صلاة</div><div class="big2">${fri && last.k === 'dhuhr' ? 'الجمعة' : NAMES[last.k]}</div>${iqt && im > 0 ? `<div class="s-next">الإقامة بعد <b>${im}</b> ${im <= 10 && im > 2 ? 'دقائق' : 'دقيقة'} · <span class="ltr">${fmt(iqt)}</span></div>` : ''}</div>`;
    } else if (soon && next) {
      $('center').innerHTML = `<div class="s-center"><div class="s-next">يُرفع أذان <b>${NAMES[next.k]}</b> بعد</div><div class="r-big" id="rcd" data-t="${+next.t}">${(() => { const x = Math.max(0, Math.round((next.t - now) / 1000)); return Math.floor(x / 60) + ':' + String(x % 60).padStart(2, '0'); })()}</div><div class="s-next"><span class="ltr">${fmt(next.t)}</span></div></div>`;
    } else {
      const left = next ? next.t - now : 0, hh = Math.floor(left / 3600e3), mm = Math.floor(left % 3600e3 / 6e4);
      $('center').innerHTML = `<div class="s-center"><div class="s-clock" id="clk">${fmt(now)}<small>:${sec}</small></div>
        ${next ? `<div class="s-next">الصلاة القادمة <b>${fri && next.k === 'dhuhr' && next.day === 'today' ? 'الجمعة' : NAMES[next.k]}</b> <span class="ltr">${fmt(next.t)}</span> · المتبقي <span class="ltr">${hh}:${String(mm).padStart(2, '0')}</span></div>` : ''}</div>`;
    }
    // بطاقة المحتوى (بالمغرب برمضان: دعاء الإفطار)
    const iftar = ev === 'after' && last && last.k === 'maghrib' && st.ramadan && st.settings.ramadan.iftarDua;
    const it = iftar ? IFTAR_DUA : ev === 'adhan' ? REPEAT_ADHAN : ev === 'after' ? DUA_ADHAN : playing === 'adhkar' ? { k: '📿 أذكار بعد الصلاة', ...AFTER_PRAYER[Math.floor(Date.now() / 30000) % AFTER_PRAYER.length] } : contentItem(now, T);
    const cc = $('ccard'); cc.hidden = !it; cc.className = 'ccard' + (ev ? ' special' : '');
    if (it) cc.innerHTML = ccardHTML(it);
    // الصيام
    $('fast').innerHTML = dsp.fasting === false ? '' : (fastCard(fastInfo(now), 'اليوم', st.today) || fastCard(fastInfo(new Date(+now + 864e5)), 'غداً', st.tomorrow));
    // قوس الشمس
    $('arc').innerHTML = dsp.sunArc === false ? '' : sunArc(T, now);
    // الكروت (بعد العشاء بنص ساعة منعرض بكرا)
    const ishaPassed = now > +T.isha + 30 * 6e4, src = ishaPassed ? T2 : T, iqs = (ishaPassed ? st.iqamaTomorrow : st.iqamaToday) || {};
    const fri2 = (ishaPassed ? (now.getDay() + 1) % 7 : now.getDay()) === 5 && st.mosque && st.mosque.jumua;
    const rows = ['fajr', 'sunrise', 'dhuhr', 'asr', 'maghrib', 'isha'];
    const hl = ev === 'adhan' && last ? last.k : next && next.k;
    $('cards').innerHTML = rows.map((k) => {
      const i = KEYS.indexOf(k), on = i < 0 || st.settings.prayers[i].enabled;
      const isJ = fri2 && k === 'dhuhr';
      const x = k === 'sunrise' ? 'الضحى ' + fmt(src.duha) : isJ ? 'الصلاة ' + st.mosque.jumua : iqs[k] ? 'إقامة ' + fmt(iqs[k]) : on ? '🔊 ' + Math.round(st.settings.prayers[i].volume * 100) + '%' : '🔇';
      return `<div class="s-card ${k === hl ? 'next' : ''} ${k === 'sunrise' ? 'small' : ''} ${on ? '' : 'off'}"><div class="n">${isJ ? 'الجمعة' : NAMES[k]}</div><div class="t">${fmt(src[k])}</div><div class="x">${x}</div></div>`;
    }).join('');
    window._ev = ev;
  }

  const esc = (x) => String(x == null ? '' : x).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  document.addEventListener('click', async (e) => {
    const b = e.target.closest('.mdone, .msnz'); if (!b) return;
    e.stopPropagation(); b.disabled = true; b.textContent = '…';
    try { await fetch(b.classList.contains('msnz') ? '/api/memo/snooze' : '/api/memo/done', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: b.dataset.key, who: 'الشاشة', mins: 5 }) }); } catch (x) { /* */ }
    load();
  }, true);

  // تبديل المحتوى والطقس
  setInterval(() => {
    if (!st) return;
    const b = $('wxbox'); const d = D().forecast !== false && Math.floor(Date.now() / 1000) % 30 >= 20; if (b) b.classList.toggle('show-days', d);
    if (window._ev || Date.now() - lastRot < (+D().rotate || 60) * 1000) return;
    lastRot = Date.now();
    const cc = $('ccard'); cc.style.opacity = 0;
    setTimeout(() => { cIdx++; tick(true); cc.style.opacity = 1; }, 800);
  }, 1000);

  // الشاشة ما تنطفي
  async function keepAwake() {
    try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) { /* */ }
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { keepAwake(); load(); weather(); } });
  document.addEventListener('click', (e) => {
    if (e.target.closest('.playing, .gear, .memo')) return;
    keepAwake();
    if (document.documentElement.requestFullscreen && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  });

  load().then(weather).then(() => tick(true));
  keepAwake();
  setInterval(() => tick(false), 1000);
  setInterval(load, 5000);
  setInterval(weather, 10 * 60000);
  setInterval(() => { if (new Date().getHours() === 3 && new Date().getMinutes() === 0) location.reload(); }, 60000);
})();
</script>
<script>
/* إذا تغيّر الإصدار بالسيرفر، الصفحة بتتحدّث لحالها */
(function () {
  let v0 = null;
  async function chk() {
    try {
      const i = await (await fetch('/api/update/info', { cache: 'no-store' })).json();
      if (v0 === null) v0 = i.version; else if (i.version && i.version !== v0) location.replace(location.pathname + '?v=' + Date.now());
    } catch (e) { /* */ }
  }
  chk(); setInterval(chk, 60000);
})();
</script>
